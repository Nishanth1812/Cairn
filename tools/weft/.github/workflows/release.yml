name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high
      - run: node .github/scripts/pack-smoke.mjs

  publish:
    needs: checks
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    permissions:
      contents: read
      id-token: write
    steps:
      - if: ${{ env.NPM_TOKEN != '' }}
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ env.NPM_TOKEN != '' }}
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
          cache: npm
      - if: ${{ env.NPM_TOKEN != '' }}
        run: npm ci
      - if: ${{ env.NPM_TOKEN != '' }}
        run: npm run build
      - if: ${{ env.NPM_TOKEN != '' }}
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
